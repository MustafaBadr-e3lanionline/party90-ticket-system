<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party90 Summer Night</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

  <header class="hero">
    <div class="overlay">
      <h1>Party90 Summer Night</h1>
      <p>عودة أجمل ذكريات الثمانينات والتسعينات</p>

      <div class="countdown">
        <div>
          <span id="days">00</span>
          <small>Days</small>
        </div>

        <div>
          <span id="hours">00</span>
          <small>Hours</small>
        </div>

        <div>
          <span id="minutes">00</span>
          <small>Minutes</small>
        </div>

        <div>
          <span id="seconds">00</span>
          <small>Seconds</small>
        </div>
      </div>

      <a href="#booking" class="btn">
        احجز تذكرتك الآن
      </a>
    </div>
  </header>

  <section class="section">
    <h2>الفيديو الدعائي للحفلة</h2>

    <div class="video-box">
      <p>
        سيتم ربط فيديو الحفلة هنا بعد رفعه إلى Cloudinary
      </p>
    </div>
  </section>

  <section class="section">
    <h2>حفلات Party90 السابقة</h2>

    <div class="video-grid">
      <div class="video-card">فيديو سابق 1</div>
      <div class="video-card">فيديو سابق 2</div>
      <div class="video-card">فيديو سابق 3</div>
    </div>
  </section>

  <section class="section ticket-section" id="booking">
    <h2>سعر التذكرة</h2>

    <div class="ticket-card">

        <h3>Regular Ticket</h3>

        <div class="price">
            350 EGP
        </div>

        <form id="bookingForm">

            <input
                type="text"
                id="customerName"
                placeholder="الاسم بالكامل"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="رقم الهاتف"
                required
            >

            <input
                type="file"
                id="paymentImage"
                accept="image/*"
                required
            >

            <button type="submit" class="btn">
                تأكيد الحجز
            </button>

        </form>

        <div id="statusMessage"></div>

    </div>
</section>

  <script src="./js/app.js"></script>

</body>
</html>
